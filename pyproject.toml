[project]
name = "anthropic-proxy-litellm"
version = "0.2.0"
description = "In-process LiteLLM proxy for Anthropic-compatible API access to any LLM"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2026.10.23",
    "claude-agent-sdk>=0.1.0",
    "litellm[proxy]>=1.81.6",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["anthropic_proxy_litellm"]

[tool.ty.environment]
python-version = "3.10"
